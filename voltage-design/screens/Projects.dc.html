<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Projects</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&amp;family=Geist:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.v{--bg:#F3F3EF;--surface:#FFFFFF;--sunk:#EAEAE4;--line:#E0E0D9;--line2:#C9C9C1;--ink:#0B0B0C;--text:#0B0B0C;--muted:#55555C;--faint:#66666D;--pic:#141416;--volt:var(--accent);font-family:'Geist',system-ui,sans-serif;font-size:14px;line-height:1.5;color:var(--text);background:var(--bg);-webkit-font-smoothing:antialiased;box-sizing:border-box}
.v *{box-sizing:border-box}
.v.dark{--bg:#0E0E10;--surface:#17171B;--sunk:#202025;--line:#2A2A30;--line2:#3C3C44;--text:#F2F2EE;--muted:#A6A6AE;--faint:#8F8F98;--pic:#000000}
.disp{font-family:'Space Grotesk',system-ui,sans-serif;letter-spacing:-0.025em}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.tag{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase}
.btn{font-family:'Space Grotesk',system-ui,sans-serif;font-size:15px;font-weight:600;height:44px;padding:0 18px;border-radius:9px;border:1.5px solid var(--text);background:transparent;color:var(--text);display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.volt{background:var(--volt);border-color:var(--ink);color:#0B0B0C;box-shadow:3px 3px 0 var(--ink)}
.btn.volt:hover{background:var(--volt);transform:translate(1px,1px);box-shadow:2px 2px 0 var(--ink)}
.nav a{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-decoration:none;padding:7px 10px;border-radius:6px}
.nav a:hover{color:var(--text);background:var(--sunk)}
.nav a.on{color:var(--volt);background:var(--ink)}
.v.dark .nav a.on{color:#0B0B0C;background:var(--volt)}
.stamp{font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px;white-space:nowrap}
.proj{display:flex;flex-direction:column;gap:12px;text-decoration:none;color:var(--text);padding:12px;border-radius:12px;border:1.5px solid transparent}
.proj:hover{border-color:var(--text);background:var(--surface);box-shadow:4px 4px 0 var(--text)}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fill{from{width:0}}
@keyframes shine{0%,70%{left:-50%}100%{left:150%}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.btn{transition:transform .15s ease,box-shadow .15s ease,background-color .15s ease}
.proj{transition:transform .2s ease,box-shadow .2s ease,border-color .2s ease;animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.proj:hover{transform:translate(-2px,-2px)}
.proj:nth-child(2){animation-delay:.08s}.proj:nth-child(3){animation-delay:.16s}.proj:nth-child(4){animation-delay:.24s}
.shine{position:relative;overflow:hidden}
.shine::after{content:"";position:absolute;top:-10%;bottom:-10%;width:28%;left:-50%;background:rgba(255,255,255,.6);transform:skewX(-20deg);animation:shine 3.6s 1s ease-in-out infinite;pointer-events:none}
h1{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.drop{transition:background-color .2s ease,border-color .2s ease}
.drop:hover{background:var(--sunk)}
.drop:hover .up{animation:bob .8s ease-in-out infinite}
.fillin{animation:fill 1.2s .3s cubic-bezier(.2,.8,.2,1) both}
@media (prefers-reduced-motion: reduce){.v *,.v *::after{animation:none!important;transition:none!important}}
a{color:inherit}
</style>
</helmet>
<div class="v {{mode}}" style="--accent: {{accent}}; min-height: 100vh">

<header style="display: flex; align-items: center; gap: 22px; flex-wrap: wrap; padding: 10px 24px; min-height: 62px; border-bottom: 1.5px solid var(--text); background: var(--surface)">
  <a href="Projects.dc.html" aria-label="Voltage home" class="disp" style="display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); font-weight: 700; font-size: 17px; letter-spacing: .02em">
    <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><rect x=".75" y=".75" width="22.5" height="22.5" rx="6" style="fill: var(--volt); stroke: var(--ink)" stroke-width="1.5"></rect><path d="M13.5 4 7 13h4.5l-1 7L17 11h-4.5z" fill="#0B0B0C"></path></svg>
    VOLTAGE
  </a>
  <nav class="nav" aria-label="Main" style="display: flex; gap: 4px; flex-wrap: wrap">
    <a href="Projects.dc.html" class="on" aria-current="page">Projects</a>
    <a href="Voices.dc.html">Voices</a>
    <a href="Usage.dc.html">Usage</a>
    <a href="Settings.dc.html">Settings</a>
  </nav>
  <div style="flex: 1"></div>
  <a href="Usage.dc.html" style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none">
    <span class="mono" style="font-weight: 600">$2.06</span>
    <span aria-hidden="true" style="display: inline-block; width: 52px; height: 8px; border-radius: 2px; border: 1.5px solid var(--text); overflow: hidden"><span class="fillin" style="display: block; width: 21%; height: 100%; background: var(--volt)"></span></span>
    <span class="tag" style="color: var(--faint)">of $10 · Oct</span>
  </a>
  <a href="Settings.dc.html" aria-label="Account" class="disp" style="width: 34px; height: 34px; border-radius: 50%; border: 1.5px solid var(--text); display: grid; place-items: center; text-decoration: none; color: var(--text); font-weight: 700; font-size: 14px">A</a>
</header>

<main style="max-width: 1120px; margin: 0 auto; padding: 56px 24px 88px; display: flex; flex-direction: column; gap: 64px">

  <section aria-labelledby="new-h" style="display: flex; flex-direction: column; gap: 24px">
    <span class="tag" style="color: var(--faint)">Good evening, Ashish</span>
    <h1 id="new-h" class="disp" style="margin: 0; font-size: clamp(40px, 5vw, 64px); line-height: 1; font-weight: 700; max-width: 820px">What should your next video <span style="background: var(--volt); color: #0B0B0C; padding: 0 8px; border-radius: 6px">say?</span></h1>
    <label for="upload" class="drop" style="position: relative; display: flex; align-items: center; gap: 28px; flex-wrap: wrap; padding: 32px; border: 1.5px dashed var(--text); border-radius: 16px; background: var(--surface); cursor: pointer">
      <span aria-hidden="true" class="up" style="width: 64px; height: 64px; border-radius: 14px; background: var(--ink); color: var(--volt); display: grid; place-items: center; flex: none">
        <svg width="28" height="28" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </span>
      <span style="display: flex; flex-direction: column; gap: 4px; flex: 1 1 280px">
        <span class="disp" style="font-size: 22px; font-weight: 700">Drop a video, or choose one</span>
        <span style="color: var(--muted)">Up to 3 minutes. With speech, or silent for a voice-over. Voltage reads it the moment it lands.</span>
      </span>
      <span style="display: flex; gap: 10px; flex-wrap: wrap">
        <span class="btn volt shine">Choose a file</span>
        <a href="FirstRead.dc.html" class="btn">Try the sample ad</a>
      </span>
      <input id="upload" type="file" accept="video/*" style="position: absolute; width: 1px; height: 1px; opacity: 0">
    </label>
  </section>

  <section aria-labelledby="recent-h" style="display: flex; flex-direction: column; gap: 18px">
    <div style="display: flex; align-items: baseline; gap: 12px">
      <h2 id="recent-h" class="disp" style="margin: 0; font-size: 26px; font-weight: 700">Recent</h2>
      <span class="tag" style="color: var(--faint)">{{count}} projects</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin: 0 -12px">
      <sc-for list="{{projects}}" as="p" hint-placeholder-count="4">
        <a href="Main.dc.html" class="proj">
          <div style="position: relative; aspect-ratio: 16 / 10; border-radius: 10px; background: var(--pic); overflow: hidden; border: 1.5px solid var(--ink)">
            <div style="position: absolute; left: 8%; right: 8%; bottom: 0; height: {{p.ground}}; background: {{p.tone}}; border-radius: 10px 10px 0 0"></div>
            <span class="mono" style="position: absolute; right: 10px; bottom: 10px; font-size: 12px; color: #FFFFFF; background: rgba(0,0,0,.6); padding: 1px 6px; border-radius: 4px">{{p.len}}</span>
            <span class="stamp" style="position: absolute; left: 10px; top: 10px; background: {{p.stampBg}}; color: {{p.stampFg}}">{{p.state}}</span>
          </div>
          <div style="display: flex; flex-direction: column; gap: 3px; padding: 0 2px">
            <span style="font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{p.name}}</span>
            <span style="font-size: 13px; color: var(--muted)">{{p.last}}</span>
            <span class="tag" style="color: var(--faint)">{{p.when}}</span>
          </div>
        </a>
      </sc-for>
    </div>
  </section>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"accent":{"editor":"color","default":"#D7FF3A","options":["#D7FF3A","#FF6B3D","#7CFFB2","#A99BFF"]},"$preview":{"width":1440,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const volt = { stampBg: 'var(--volt)', stampFg: '#0B0B0C' };
    const plain = { stampBg: 'rgba(0,0,0,.6)', stampFg: '#FFFFFF' };
    const projects = [
      Object.assign({ name: 'bhaji-cam-ad.mp4', len: '0:48', state: '2 proposed', last: 'Line 2 redone in the Customer’s own voice', when: 'Today · 11:40', ground: '32%', tone: '#232327' }, volt),
      Object.assign({ name: 'goa-beach.mov', len: '0:07', state: 'Exported', last: 'Voice-over in Goa Narrator, over the picture', when: 'Yesterday', ground: '45%', tone: '#2B2A26' }, plain),
      Object.assign({ name: 'sample-ad.mp4', len: '0:02', state: 'Exported', last: '“20% off” became “30% off”', when: '12 Oct', ground: '25%', tone: '#26262B' }, plain),
      Object.assign({ name: 'diwali-25-variant.mp4', len: '0:48', state: 'Draft', last: 'Variant of bhaji-cam-ad, plan not run', when: '10 Oct', ground: '32%', tone: '#232327' }, plain)
    ];
    return { mode: this.props.dark ? 'dark' : '', accent: this.props.accent ?? '#D7FF3A', projects, count: projects.length };
  }
}
</script>
</body>
</html>
