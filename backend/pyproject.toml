[project]
name = "agentic-video-editor-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.6",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",  # multipart/form-data uploads
    "httpx>=0.27",              # vendor HTTP calls (OpenAI, ElevenLabs)
    "numpy>=2.0",               # continuity signal analysis, audio splicing
    "anthropic>=1.8",           # Claude reads free-form edit requests (Phase 8)
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
# Phase 15: local models, optional. Without them the app runs as before: no
# stems (the voice is laid over the original mix) and no measured identity.
room = ["demucs>=4.0.1", "torch>=2.2", "torchaudio>=2.2"]           # stem separation (15c)
measure = ["torch>=2.2", "torchaudio>=2.2", "transformers>=4.40"]    # SIM-o and UTMOS (15d)
# Phase 17: faces (where there is a mouth to move) and measured lip-sync (LSE-C/D).
mouth = ["opencv-python-headless>=4.9", "torch>=2.2", "torchaudio>=2.2"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# Only `app` is the package. Without this, setuptools' flat-layout discovery
# also finds `tests/` and the `var/` artifact store and refuses to build.
[tool.setuptools.packages.find]
include = ["app*"]
